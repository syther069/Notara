[package]
name = "agentspend-registry"
version = "0.1.0"
edition = "2021"
description = "Notara shared report registry: reports with evidence references, verification status and disputes"
license = "MIT"
repository = "https://github.com/syther069/Notara"

# Reproducible build (NEP-330 source metadata), from the official `cargo near new` template.
# `cargo near build reproducible-wasm` builds inside this pinned image, so anyone can rebuild the same wasm.
[package.metadata.near.reproducible_build]
image = "sourcescan/cargo-near:0.22.0-rust-1.99.1"
image_digest = "sha256:c9655eaf7436b90c87ea8b25739f91063032c5c30ba24cfeafe72c142943b5bb"
passed_env = []
container_build_command = ["cargo", "near", "build", "non-reproducible-wasm", "--locked"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = { workspace = true }

[dev-dependencies]
near-sdk = { workspace = true, features = ["unit-testing"] }
